<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      var l = window.location;
      if (!l.pathname.endsWith('/') && !l.pathname.includes('.')) {
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname + '/' + l.search + l.hash);
      }
    </script>
  </head>
  <body>
  </body>
</html>
